services:
  gitlab:
    image: gitlab/gitlab-ce:18.11.5-ce.0
    container_name: gitlab
    restart: always
    hostname: ${GITLAB_HOSTNAME}
    env_file:
      - .env
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url "${GITLAB_EXTERNAL_URL}"

        letsencrypt['enable'] = false
        gitlab_rails['nginx']['redirect_http_to_https'] = ${GITLAB_REDIRECT_HTTP_TO_HTTPS}

        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT}
        gitlab_rails['time_zone'] = 'Asia/Seoul'
        gitlab_rails['backup_keep_time'] = 604800
        gitlab_rails['initial_root_password'] = "${GITLAB_ROOT_PASSWORD}"

        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_address'] = "${GITLAB_SMTP_HOST}"
        gitlab_rails['smtp_port'] = ${GITLAB_SMTP_PORT}
        gitlab_rails['smtp_domain'] = "${GITLAB_SMTP_DOMAIN}"
        gitlab_rails['smtp_authentication'] = false
        gitlab_rails['smtp_enable_starttls_auto'] = false
        gitlab_rails['gitlab_email_from'] = "${GITLAB_EMAIL_FROM}"
    ports:
      - "${GITLAB_HTTP_PORT}:${GITLAB_HTTP_PORT}"
      - "${GITLAB_HTTPS_PORT}:${GITLAB_HTTPS_PORT}"
      - "${GITLAB_SSH_PORT}:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
      - ${GITLAB_SSL_DIR:-./ssl}:/etc/gitlab/ssl:ro
    shm_size: '512m'
    deploy:
      resources:
        limits:
          memory: 16g
        reservations:
          memory: 4g
    networks:
      - gitlab_network

volumes:
  gitlab_config:
    driver: local
  gitlab_logs:
    driver: local
  gitlab_data:
    driver: local

networks:
  gitlab_network:
    driver: bridge
